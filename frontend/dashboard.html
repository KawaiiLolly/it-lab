<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body class="app-body">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand">E-Assessment Platform</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <div class="card mb-4">
        <div class="card-body">
            <h4 class="card-title mb-3">My Details</h4>
            <p class="mb-1"><strong>Name:</strong> <span id="uName">-</span></p>
            <p class="mb-1"><strong>Roll No:</strong> <span id="uRoll">-</span></p>
            <p class="mb-0"><strong>Email:</strong> <span id="uEmail">-</span></p>
        </div>
    </div>

    <div class="card mb-5">
        <div class="card-body text-center" id="testStatusBox">
            <p class="text-muted">Checking test status...</p>
        </div>
    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/quiz.js"></script>
<script>
requireAuth();

(async function () {
    const profileResult = await fetchProfile();
    if (!profileResult.ok) { logout(); return; }

    document.getElementById("uName").innerText = profileResult.data.full_name;
    document.getElementById("uRoll").innerText = profileResult.data.roll_no || "-";
    document.getElementById("uEmail").innerText = profileResult.data.email;

    const statusResult = await fetchQuizStatus();
    const box = document.getElementById("testStatusBox");

    if (!statusResult.ok) {
        box.innerHTML = '<p class="text-danger">Could not check test status.</p>';
        return;
    }

    const s = statusResult.data;

    if (s.attempted) {
        box.innerHTML = `
            <h5 class="mb-2">You have already attempted this test.</h5>
            <p class="mb-0">Questions Attempted: ${s.attempted_count} / ${s.total_questions}</p>
            <p class="mb-0">Marks Obtained: <strong>${s.score}</strong></p>
            <p class="text-muted mt-3 mb-0">Only one attempt is allowed per candidate.</p>
        `;
    } else if (s.in_progress) {
        box.innerHTML = `
            <h5 class="mb-3">You have a test in progress.</h5>
            <a href="instructions.html" class="btn btn-warning btn-lg">Resume Test</a>
        `;
    } else {
        box.innerHTML = `
            <h5 class="mb-3">Ready to begin?</h5>
            <a href="instructions.html" class="btn btn-primary btn-lg">Start Test</a>
            <p class="text-muted mt-3 mb-0">Note: you get only ONE attempt at this test.</p>
        `;
    }
})();
</script>

</body>
</html>
