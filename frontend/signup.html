<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-card">
    <h3>Create Account</h3>
    <form id="signupForm">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Roll No</label>
            <input type="text" class="form-control" id="rollNo" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    </form>
    <p id="message"></p>
    <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
</div>

<script src="js/auth.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const rollNo = document.getElementById("rollNo").value;
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");

    const result = await signupUser(fullName, email, password, rollNo);

    if (result.ok) {
        messageEl.className = "text-success";
        messageEl.innerText = "Account created! Redirecting to login...";
        setTimeout(() => window.location.href = "login.html", 1500);
    } else {
        messageEl.className = "text-danger";
        messageEl.innerText = JSON.stringify(result.data);
    }
});
</script>

</body>
</html>
